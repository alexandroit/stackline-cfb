# Dependency PRs only; publication remains in the release workflow.
version: 2
updates:
- package-ecosystem: npm
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: '10:00'
    timezone: America/Toronto
  open-pull-requests-limit: 5
  groups:
    compatible-updates:
      patterns:
      - '*'
      update-types:
      - minor
      - patch
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: weekly
    day: monday
    time: '10:30'
    timezone: America/Toronto
  open-pull-requests-limit: 3
  groups:
    github-actions:
      patterns:
      - '*'
