name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: node scripts/ci-install.mjs
      - run: node --test scripts/registry-requests.test.mjs
      - run: npm run build --if-present
      - run: npm test
      - run: npm run lint --if-present
      - run: npm run test:types --if-present
      - run: npm run test:package --if-present
      - run: npm audit --audit-level=low
      - name: Ensure builds and tests preserve committed source
        run: git diff --exit-code
      - name: Pack the tested source
        if: matrix.node == 24
        run: mkdir artifact && npm pack --ignore-scripts --pack-destination artifact
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: matrix.node == 24
        with:
          name: npm-package
          path: artifact/*.tgz
          if-no-files-found: error
          retention-days: 90
