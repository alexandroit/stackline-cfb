name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful main-branch CI run containing the reviewed npm-package artifact
        required: true
        type: string
      bootstrap:
        description: Use the temporary Prod NPM_BOOTSTRAP_TOKEN only for the first package version
        required: true
        default: false
        type: boolean
      expected_source_commit:
        description: For recovery only, the original 40-character commit from npm provenance
        required: false
        type: string
      expected_publication_run:
        description: For recovery only, the original GitHub Actions invocation URL from npm provenance
        required: false
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Prod
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require successful CI and CodeQL for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CI_RUN_ID" =~ ^[0-9]+$ ]]
          test "$GITHUB_REPOSITORY" = alexandroit/stackline-cfb
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID" > "$RUNNER_TEMP/ci.json"
          jq -e --arg sha "$GITHUB_SHA" --arg repo "$GITHUB_REPOSITORY" '
            .head_sha == $sha and .head_branch == "main" and .event == "push" and
            .head_repository.full_name == $repo and .path == ".github/workflows/ci.yml" and
            .status == "completed" and .conclusion == "success"
          ' "$RUNNER_TEMP/ci.json"
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/codeql.yml/runs?head_sha=$GITHUB_SHA&event=push&branch=main&per_page=1" > "$RUNNER_TEMP/codeql.json"
          jq -e --arg sha "$GITHUB_SHA" '
            .workflow_runs[0] | .head_sha == $sha and
            .status == "completed" and .conclusion == "success"
          ' "$RUNNER_TEMP/codeql.json"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.20.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Use the verified npm release toolchain
        run: npm install --global npm@11.19.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package
          path: artifact
          github-token: ${{ github.token }}
          run-id: ${{ inputs.ci_run_id }}
      - name: Check the CI artifact identity
        shell: bash
        run: |
          set -euo pipefail
          archive="artifact/stackline-cfb-$(node -p "require('./package.json').version").tgz"
          test "$(find artifact -name '*.tgz' | wc -l)" -eq 1
          tar -xOf "$archive" package/package.json > "$RUNNER_TEMP/packed-package.json"
          node -e "require('node:assert/strict').deepEqual(require(process.argv[1]), require('./package.json'))" "$RUNNER_TEMP/packed-package.json"
          sha256sum "$archive"
          npm --version
      - name: Check whether this exact artifact is already published
        id: registry
        run: node scripts/check-publish-status.mjs artifact/*.tgz
      - name: Require explicit provenance identity during recovery
        if: steps.registry.outputs.published == 'true'
        env:
          EXPECTED_SOURCE_COMMIT: ${{ inputs.expected_source_commit }}
          EXPECTED_PUBLICATION_RUN: ${{ inputs.expected_publication_run }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_PUBLICATION_RUN" =~ ^https://github.com/alexandroit/stackline-cfb/actions/runs/[0-9]+/attempts/[0-9]+$ ]]
      - name: Enforce first-version bootstrap or established-package OIDC
        if: steps.registry.outputs.published == 'false'
        env:
          BOOTSTRAP: ${{ inputs.bootstrap }}
          PACKAGE_EXISTS: ${{ steps.registry.outputs.package_exists }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if [[ "$BOOTSTRAP" == "true" ]]; then
            test "$version" = "1.0.0"
            test "$PACKAGE_EXISTS" = "false"
          else
            test "$PACKAGE_EXISTS" = "true"
          fi
      - name: Require the temporary first-publication token
        if: steps.registry.outputs.published == 'false' && steps.registry.outputs.package_exists == 'false' && inputs.bootstrap == true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        shell: bash
        run: test -n "$NODE_AUTH_TOKEN"
      - name: Publish the exact CI tarball with OIDC and provenance
        if: steps.registry.outputs.published == 'false' && steps.registry.outputs.package_exists == 'true' && inputs.bootstrap == false
        run: npm publish ./artifact/*.tgz --access public --provenance --ignore-scripts
      - name: Bootstrap the first version from the exact CI tarball
        if: steps.registry.outputs.published == 'false' && steps.registry.outputs.package_exists == 'false' && inputs.bootstrap == true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: npm publish ./artifact/*.tgz --access public --provenance --ignore-scripts
      - name: Verify npm bytes, normal installs, signatures, and provenance
        env:
          EXPECTED_SOURCE_COMMIT: ${{ steps.registry.outputs.published == 'true' && inputs.expected_source_commit || github.sha }}
          EXPECTED_PUBLICATION_RUN: ${{ steps.registry.outputs.published == 'true' && inputs.expected_publication_run || format('https://github.com/{0}/actions/runs/{1}/attempts/{2}', github.repository, github.run_id, github.run_attempt) }}
        run: node scripts/verify-registry.mjs artifact/*.tgz
      - name: Assemble evidence for the verified artifact
        env:
          CI_RUN_ID: ${{ inputs.ci_run_id }}
        run: node scripts/release-evidence.mjs artifact
      - name: Publish and verify the immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-github-release.mjs artifact
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: published-package-evidence
          path: artifact/*
          if-no-files-found: error
          retention-days: 90
